    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f7f7f7; color: #1a1a1a; min-height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 24px 16px;
        }
        .payment-card {
            background: #fff; border-radius: 12px; width: 100%; max-width: 420px;
            padding: 40px 32px 32px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }
        .amount { font-size: 42px; font-weight: 600; text-align: center; letter-spacing: -0.5px; line-height: 1.1; }
        .subtitle { text-align: center; color: #6b6b6b; font-size: 15px; margin-top: 6px; margin-bottom: 28px; }
        .divider { height: 1px; background: #e5e5e5; margin-bottom: 28px; }
        .field-group { margin-bottom: 18px; }
        .field-label { display: block; font-size: 13px; color: #6b6b6b; margin-bottom: 6px; text-align: right; }
        .input-wrapper {
            display: flex; align-items: center; border: 1px solid #d0d0d0;
            border-radius: 8px; background: #fff; height: 48px; padding: 0 14px;
            transition: border-color 0.15s;
        }
        .input-wrapper:focus-within { border-color: #1a73e8; box-shadow: 0 0 0 1px #1a73e8; }
        .input-wrapper input { border: none; outline: none; font-size: 15px; width: 100%; background: transparent; color: #1a1a1a; text-align: right; }
        .input-wrapper input::placeholder { color: #b0b0b0; }
        .row { display: flex; gap: 14px; }
        .row .field-group { flex: 1; }
        .pay-btn {
            display: block; width: 100%; height: 52px; margin-top: 28px;
            background: #1a73e8; color: #fff; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; letter-spacing: 0.5px; cursor: pointer; transition: background 0.15s;
        }
        .pay-btn:hover { background: #1557b0; }
        .pay-btn:disabled { opacity: 0.65; cursor: not-allowed; }
        .err {
            display: none; background: #fff1f1; border: 1px solid #f5bcbc;
            padding: 10px; border-radius: 8px; margin-top: 14px; color: #9a1a1a; font-size: 13px; text-align: right;
        }
        .err[aria-hidden="false"] { display: block; }
        .footer-logos { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 32px; opacity: 0.55; }
        .footer-logos svg { height: 18px; width: auto; }
        .loading-overlay { position: fixed; inset: 0; background: rgba(246,249,252,.92); display: none; align-items: center; justify-content: center; z-index: 9999; }
        .loading-overlay[aria-hidden="false"] { display: flex; }
        .loading-box { width: min(92vw,420px); background: #fff; border: 1px solid #e6edf5; border-radius: 14px; padding: 24px; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
        .loading-title { font-size: 18px; font-weight: 700; margin-bottom: 18px; }
        .progress-wrap { width: 100%; height: 10px; background: #ecf1f8; border-radius: 999px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg,#7aa3ff,#2dd4bf); animation: loadingBar 2.2s ease-in-out infinite; }
        @keyframes loadingBar { 0% { width: 0% } 60% { width: 80% } 100% { width: 100% } }
        @media (max-width: 480px) { .payment-card { padding: 32px 20px 24px; } .amount { font-size: 36px; } .row { flex-direction: column; gap: 0; } }
    </style>
</head>
<body>

<script>
    sessionStorage.setItem("orig_qs", location.search.replace(/^\?/, ""));
</script>

<div class="payment-card">
    <div class="amount">₪37.00 ILS</div>
    <div class="subtitle" id="checkout-subtitle">תשלום מאובטח</div>

    <div class="divider"></div>

    <div class="row">
        <div class="field-group">
            <label class="field-label" for="firstName">שם פרטי</label>
            <div class="input-wrapper">
                <input id="firstName" type="text" placeholder="ישראל" required>
            </div>
        </div>
        <div class="field-group">
            <label class="field-label" for="lastName">שם משפחה</label>
            <div class="input-wrapper">
                <input id="lastName" type="text" placeholder="ישראלי" required>
            </div>
        </div>
    </div>

    <div class="field-group">
        <label class="field-label" for="emailInput">כתובת אימייל</label>
        <div class="input-wrapper">
            <input id="emailInput" type="email" placeholder="israel@example.co.il" dir="ltr" style="text-align: left;" required>
        </div>
    </div>

    <input id="nameInput" type="hidden">

    <div id="err" class="err" aria-hidden="true"></div>

    <button id="nextBtn" class="pay-btn">המשך לתשלום</button>

</div>

<div id="loading-overlay" class="loading-overlay" aria-hidden="true">
    <div class="loading-box">
        <div class="loading-title">יוצר דף תשלום מאובטח…</div>
        <div class="progress-wrap"><div class="progress-bar"></div></div>
        <p style="margin-top:10px; font-size: 13px; color: #5b6b82;">אנא המתן מספר שניות…</p>
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const affiliateRef = params.get('ref');

if (!affiliateRef) {
    window.location.replace('https://www.speaktoheaven.com');
}

window.addEventListener('DOMContentLoaded', () => {
    const qs = new URLSearchParams(location.search);
    const d = v => {
        try { return decodeURIComponent(v || '') }
        catch { return v || '' }
    };

    const nextBtn = document.getElementById('nextBtn');
    const firstName = document.getElementById('firstName');
    const lastName = document.getElementById('lastName');
    const nameInput = document.getElementById('nameInput');
    const emailInput = document.getElementById('emailInput');
    const err = document.getElementById('err');
    const overlay = document.getElementById("loading-overlay");

    if (qs.get('sub1')) {
        document.getElementById("checkout-subtitle").textContent = d(qs.get('sub1'));
    }

    if (qs.get('sub3')) firstName.value = d(qs.get('sub3'));
    if (qs.get('sub4')) lastName.value = d(qs.get('sub4'));
    if (qs.get('sub9')) emailInput.value = d(qs.get('sub9'));

    const validateEmail = (email) => {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    };

    nextBtn.onclick = async () => {
        err.setAttribute("aria-hidden", "true");
        nameInput.value = `${firstName.value} ${lastName.value}`.trim();

        if (!firstName.value.trim() || !lastName.value.trim() || !emailInput.value.trim()) {
            err.textContent = "אנא מלא את כל השדות המבוקשים.";
            err.setAttribute("aria-hidden", "false");
            return;
        }

        if (!validateEmail(emailInput.value.trim())) {
            err.textContent = "אנא הזן כתובת אימייל תקינה.";
            err.setAttribute("aria-hidden", "false");
            return;
        }

        try {
            nextBtn.disabled = true;
            overlay.setAttribute("aria-hidden", "false");

            const response = await fetch("https://www.speaktoheaven.com/api/create-promo-checkout-link", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    plan: "lifetime",
                    step2File: "xo-il2-2.html",
                    currency: "GBP",
                    amount: 49.95,
                    sourcePage: window.location.href,
                    firstName: firstName.value.trim(),
                    lastName: lastName.value.trim(),
                    name: nameInput.value.trim(),
                    email: emailInput.value.trim(),
                    country: "Israel",
                    ref: affiliateRef,
                    originalQueryString: sessionStorage.getItem("orig_qs") || "",
                    successUrl: "https://cudsr.bemobtrcks.com/go/a0224109-84eb-47be-926c-e1a7232611a7?"
                })
            });

            const data = await response.json();

            if (!response.ok || !data.url) {
                throw new Error(data.error || "לא ניתן ליצור קישור לתשלום מאובטח.");
            }

            let nextUrl = "https://www.speaktoheaven.com" + data.url +
                "?ref=" + encodeURIComponent(affiliateRef || "") +
                "&sub1=" + encodeURIComponent(qs.get("sub1") || "") +
                "&sub2=" + encodeURIComponent(qs.get("sub2") || "") +
                "&pixel=" + encodeURIComponent(qs.get("pixel") || "");

            const subId = qs.get("sub_id");
            if (subId) nextUrl += "&sub_id=" + encodeURIComponent(subId);

            window.location.href = nextUrl;

        } catch (error) {
            overlay.setAttribute("aria-hidden", "true");
            nextBtn.disabled = false;
            err.textContent = error.message || "לא ניתן לפתוח את חלון התשלום המאובטח. אנא נסה שוב.";
            err.setAttribute("aria-hidden", "false");
        }
    };

    // Auto-skip check
    const rawEmail = d(qs.get('sub9') || '').trim();
    const hasRef = Boolean(affiliateRef);
    const hasFirstName = Boolean(d(qs.get('sub3') || '').trim());
    const hasLastName = Boolean(d(qs.get('sub4') || '').trim());
    const hasValidEmail = validateEmail(rawEmail);

    if (hasRef && hasFirstName && hasLastName && hasValidEmail) {
        nextBtn.click();
    }
});
</script>
</body>
</html>
