    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f7f7f7;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
        }

        .payment-card {
            background: #fff;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 40px 32px 32px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            position: relative;
        }

        .amount {
            font-size: 42px;
            font-weight: 600;
            text-align: center;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .subtitle {
            text-align: center;
            color: #6b6b6b;
            font-size: 15px;
            margin-top: 6px;
            margin-bottom: 28px;
        }

        .divider {
            height: 1px;
            background: #e5e5e5;
            margin-bottom: 28px;
        }

        .step {
            display: none;
        }

        .step[aria-hidden="false"] {
            display: block;
        }

        .field-group {
            margin-bottom: 18px;
        }

        .field-label {
            display: block;
            font-size: 13px;
            color: #6b6b6b;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            border: 1px solid #d0d0d0;
            border-radius: 8px;
            background: #fff;
            height: 48px;
            padding: 0 14px;
            transition: border-color 0.15s;
        }

        .input-wrapper:focus-within {
            border-color: #1a73e8;
            box-shadow: 0 0 0 1px #1a73e8;
        }

        .input-wrapper.card-number {
            gap: 10px;
            padding: 0 14px;
        }

        .card-logo {
            width: 28px;
            height: 18px;
            flex-shrink: 0;
        }

        .input-wrapper input {
            border: none;
            outline: none;
            font-size: 15px;
            width: 100%;
            background: transparent;
            color: #1a1a1a;
            letter-spacing: 0.3px;
        }

        .input-wrapper input::placeholder {
            color: #b0b0b0;
        }

        /* Hosted Payment Fields Container */
        .hosted-field-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
        }

        .row {
            display: flex;
            gap: 14px;
        }

        .row .field-group {
            flex: 1;
        }

        .lock-icon {
            width: 16px;
            height: 16px;
            color: #6b6b6b;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .pay-btn {
            display: block;
            width: 100%;
            height: 52px;
            margin-top: 28px;
            background: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .pay-btn:hover {
            background: #1557b0;
        }

        .pay-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .err {
            display: none;
            background: #fff1f1;
            border: 1px solid #f5bcbc;
            padding: 10px;
            border-radius: 8px;
            margin-top: 14px;
            color: #9a1a1a;
            font-size: 13px;
        }

        .err[aria-hidden="false"] {
            display: block;
        }

        .footer-logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 32px;
            opacity: 0.55;
        }

        .footer-logos svg {
            height: 18px;
            width: auto;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(246, 249, 252, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-overlay[aria-hidden="false"] {
            display: flex;
        }

        .loading-box {
            width: min(92vw, 420px);
            background: #fff;
            border: 1px solid #e6edf5;
            border-radius: 14px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }

        .loading-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .progress-wrap {
            width: 100%;
            height: 10px;
            background: #ecf1f8;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #7aa3ff, #2dd4bf);
            animation: loadingBar 2.2s ease-in-out infinite;
        }

        @keyframes loadingBar {
            0% { width: 0% }
            60% { width: 80% }
            100% { width: 100% }
        }

        @media (max-width: 480px) {
            .payment-card {
                padding: 32px 20px 24px;
            }

            .amount {
                font-size: 36px;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>

<!-- Loading Overlay -->
<div id="loading-overlay" class="loading-overlay" aria-hidden="true">
    <div class="loading-box">
        <div class="loading-title">Zahlung wird verarbeitet…</div>
        <div class="progress-wrap"><div class="progress-bar"></div></div>
        <p style="margin-top:10px; font-size: 13px; color: #5b6b82;">Bitte warten Sie einige Sekunden…</p>
    </div>

<script>
// Key parameters from existing scripts
const tokenFromServer = window.PROMO_CHECKOUT_TOKEN || null;
const publicIntegrationKey = window.XOLVIS_PUBLIC_INTEGRATION_KEY || "";
const params = new URLSearchParams(window.location.search);
const affiliateRef = params.get('ref');

// Decode helper
const d = v => {
    try { return decodeURIComponent(v || '') }
    catch { return v || '' }
};

// Prefill Subtitle if sub1 present
const productTitleFromUrl = d(params.get("sub1"));
if (productTitleFromUrl) {
    document.getElementById("checkout-subtitle").textContent = productTitleFromUrl;
}

// Global state
let payment = null;
let paymentReady = false;

// DOM Elements
const step1 = document.getElementById("step1");
const step2 = document.getElementById("step2");
const step1Err = document.getElementById("step1-err");
const step2Err = document.getElementById("step2-err");

const firstNameInput = document.getElementById("firstName");
const lastNameInput = document.getElementById("lastName");
const emailInput = document.getElementById("emailInput");
const cardholderNameInput = document.getElementById("cardholder-name");

const nextBtn = document.getElementById("nextBtn");
const payNow = document.getElementById("payNow");
const backBtn = document.getElementById("backBtn");
const overlay = document.getElementById("loading-overlay");

// Error display functions
function showError(element, message) {
    element.textContent = message;
    element.setAttribute("aria-hidden", "false");
}

function clearError(element) {
    element.textContent = "";
    element.setAttribute("aria-hidden", "true");
}

function setLoading(isLoading) {
    payNow.disabled = isLoading;
    overlay.setAttribute("aria-hidden", isLoading ? "false" : "true");
}

// Prefill Step 1 fields from URL parameters if present
if (params.get('sub3')) firstNameInput.value = d(params.get('sub3'));
if (params.get('sub4')) lastNameInput.value = d(params.get('sub4'));
if (params.get('sub9')) emailInput.value = d(params.get('sub9'));

// Handle Step 1 -> Step 2 transition
nextBtn.onclick = () => {
    clearError(step1Err);

    const firstName = firstNameInput.value.trim();
    const lastName = lastNameInput.value.trim();
    const email = emailInput.value.trim();

    if (!firstName || !lastName || !email) {
        showError(step1Err, "Bitte füllen Sie Vorname, Nachname und E-Mail-Adresse aus.");
        return;
    }

    // Auto-populate Cardholder Name for Step 2
    cardholderNameInput.value = `${firstName} ${lastName}`;

    // Switch view to Step 2
    step1.setAttribute("aria-hidden", "true");
    step2.setAttribute("aria-hidden", "false");

    // Initialize Payment.js once user reaches Step 2
    initPaymentJs();
};

// Handle Back Button
backBtn.onclick = () => {
    clearError(step2Err);
    step2.setAttribute("aria-hidden", "true");
    step1.setAttribute("aria-hidden", "false");
};

// Initialize Xolvis Payment.js Hosted Fields
function initPaymentJs() {
    if (payment) return; // Avoid re-initialization

    if (!tokenFromServer) {
        showError(step2Err, "Ungültiger oder abgelaufener Zahlungslink.");
        payNow.disabled = true;
        return;
    }

    if (!publicIntegrationKey) {
        showError(step2Err, "Zahlungskonfiguration fehlt.");
        payNow.disabled = true;
        return;
    }

    try {
        payment = new PaymentJs();

        payment.init(
            publicIntegrationKey,
            "number_div",
            "cvv_div",
            function (paymentInstance) {
                paymentReady = true;

                paymentInstance.setNumberPlaceholder("•••• •••• •••• ••••");
                paymentInstance.setCvvPlaceholder("•••");

                paymentInstance.setNumberStyle({
                    "font-size": "15px",
                    "font-family": "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
                    "color": "#1a1a1a"
                });

                paymentInstance.setCvvStyle({
                    "font-size": "15px",
                    "font-family": "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
                    "color": "#1a1a1a"
                });

                payNow.disabled = false;
            }
        );
    } catch (error) {
        console.error("Xolvis initialization error:", error);
        showError(step2Err, error?.message || "Zahlungsfelder konnten nicht geladen werden.");
        payNow.disabled = true;
    }
}

// Payment Submission
payNow.onclick = () => {
    clearError(step2Err);

    if (!tokenFromServer) {
        showError(step2Err, "Ungültiger oder abgelaufener Zahlungslink.");
        return;
    }

    if (!paymentReady || !payment) {
        showError(step2Err, "Zahlungsfelder werden noch geladen. Bitte warten.");
        return;
    }

    const cardholderName = cardholderNameInput.value.trim();
    const expMonth = document.getElementById("exp_month").value.trim();
    const expYear = document.getElementById("exp_year").value.trim();

    if (!cardholderName || !expMonth || !expYear) {
        showError(step2Err, "Bitte füllen Sie alle Kartendetails aus.");
        return;
    }

    setLoading(true);

    payment.tokenize(
        {
            card_holder: cardholderName,
            month: expMonth,
            year: expYear
        },
        async function (transactionToken, cardData) {
            try {
                const response = await fetch("/api/create-promo-payment", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        checkoutToken: tokenFromServer,
                        cardholderName: cardholderName,
                        transactionToken: transactionToken,
                        cardData: cardData,
                        firstName: firstNameInput.value.trim(),
                        lastName: lastNameInput.value.trim(),
                        email: emailInput.value.trim()
                    })
                });

                const text = await response.text();
                let data;

                try {
                    data = JSON.parse(text);
                } catch {
                    throw new Error(text || "Der Server hat eine ungültige Antwort zurückgegeben.");
                }

                if (!response.ok || data.success === false || data.returnType === "ERROR") {
                    throw new Error(
                        data.error ||
                        data.errorMessage ||
                        data.details?.errorMessage ||
                        "Zahlung fehlgeschlagen."
                    );
                }

                if (data.returnType === "REDIRECT" && data.redirectUrl) {
                    window.location.href = data.redirectUrl;
                    return;
                }

                const qs = new URLSearchParams(location.search);
                const sub1 = qs.get("sub1") || "";
                const sub2 = qs.get("sub2") || "";

                window.location.href =
                    "https://cudsr.bemobtrcks.com/go/a0224109-84eb-47be-926c-e1a7232611a7?" +
                    "ref=" + encodeURIComponent(affiliateRef || "") +
                    "&sub1=" + encodeURIComponent(sub1) +
                    "&sub2=" + encodeURIComponent(sub2);

            } catch (error) {
                console.error("Xolvis payment error:", error);
                setLoading(false);
                showError(step2Err, error?.message || "Zahlung fehlgeschlagen.");
            }
        },
        function (errors) {
            console.error("Xolvis tokenization errors:", errors);
            setLoading(false);

            const message = Array.isArray(errors)
                ? errors.map(e => e.message || e.key || "Fehler im Zahlungsfeld").join(" ")
                : "Bitte überprüfen Sie Ihre Kartendetails.";

            showError(step2Err, message);
        }
    );
};
</script>
